<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Technch- HOTSPOT</title>
</head>
<body>
  <p>Opening Technch- HOTSPOT billing...</p>
  <p><a id="portalLink" href="https://technch-hotspot.vercel.app/">Continue to packages</a></p>
  <script>
    const portal = new URL('https://technch-hotspot.vercel.app/');
    portal.searchParams.set('gateway', 'mikrotik');
    portal.searchParams.set('clientmac', '$(mac)');
    portal.searchParams.set('clientip', '$(ip)');
    document.querySelector('#portalLink').href = portal.href;
    location.replace(portal.href);
  </script>
</body>
</html>
