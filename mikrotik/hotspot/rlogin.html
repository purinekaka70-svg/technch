<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Jamii WiFi</title>
</head>
<body>
  <p>Opening Jamii WiFi...</p>
  <p><a href="https://technch-yey9.vercel.app/?gateway=mikrotik&amp;clientmac=$(mac)&amp;clientip=$(ip)">Continue to WiFi packages</a></p>
  <script>
    // Build the URL in JavaScript so RouterOS can substitute its variables
    // without parsing them inside a meta-refresh attribute.
    const portal = new URL('https://technch-yey9.vercel.app/');
    portal.searchParams.set('gateway', 'mikrotik');
    portal.searchParams.set('clientmac', '$(mac)');
    portal.searchParams.set('clientip', '$(ip)');
    portal.searchParams.set('hotspotlogin', '$(link-login-only)');
    document.querySelector('a').href = portal;
    window.location.replace(portal.toString());
  </script>
</body>
</html>
